<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Train Delay Report</title>
<style>
  :root{
    --xc-red:#d71920;
    --xc-gold:#f5b400;
    --dark:#222;
    --light:#f5f5f5;
    --border:#d6d6d6;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#eee;
    color:var(--dark);
  }
  .wrap{max-width:620px;margin:0 auto;padding:14px}
  .card{
    background:#fff;border-radius:14px;overflow:hidden;
    box-shadow:0 3px 14px rgba(0,0,0,.12);
  }
  header{
    background:linear-gradient(135deg,var(--xc-red),#b50f16);
    color:#fff;padding:20px 18px 18px;
    border-bottom:5px solid var(--xc-gold);
  }
  header h1{margin:0;font-size:27px;line-height:1.1}
  header p{margin:7px 0 0;font-size:14px;line-height:1.4;opacity:.96}
  form{padding:18px}
  .field{margin-bottom:17px}
  label{
    display:block;font-weight:700;font-size:15px;margin-bottom:7px;
  }
  input,select,textarea{
    width:100%;font:inherit;font-size:16px;
    border:1px solid var(--border);border-radius:9px;
    padding:12px;background:#fff;color:#222;
    outline:none;
  }
  input:focus,select:focus,textarea:focus{
    border-color:var(--xc-red);
    box-shadow:0 0 0 3px rgba(215,25,32,.12);
  }
  input[type="number"]{font-size:20px;font-weight:700}
  textarea{min-height:105px;resize:vertical}
  .hidden{display:none}
  .buttons{display:grid;gap:10px;margin-top:20px}
  button{
    border:0;border-radius:10px;padding:14px 16px;
    font:inherit;font-weight:800;font-size:16px;cursor:pointer;
    min-height:50px;
  }
  .primary{background:var(--xc-red);color:#fff}
  .secondary{background:var(--xc-gold);color:#222}
  button:active{transform:translateY(1px)}
  .status{
    min-height:20px;text-align:center;font-size:13px;
    font-weight:700;margin-top:10px;
  }
  .preview{
    margin-top:18px;padding:13px;background:var(--light);
    border-left:4px solid var(--xc-red);border-radius:7px;
    font-size:13px;line-height:1.45;
  }
  .preview strong{display:block;margin-bottom:5px}
  .required{color:var(--xc-red)}
  footer{text-align:center;font-size:11px;color:#666;padding:0 18px 18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <header>
      <h1>Train Delay Report</h1>
      <p>This report is to email your line manager about on-the-day delays.</p>
    </header>

    <form id="delayForm" onsubmit="return false;">
      <div class="field">
        <label for="date">Date</label>
        <input id="date" type="date">
      </div>

      <div class="field">
        <label for="headcode">Headcode <span class="required">*</span></label>
        <input id="headcode" type="text" placeholder="e.g. 1V50" autocapitalize="characters" autocomplete="off" required>
      </div>

      <div class="field">
        <label for="delay">Delay in Minutes <span class="required">*</span></label>
        <input id="delay" type="number" inputmode="numeric" pattern="[0-9]*" min="1" step="1" placeholder="e.g. 15" required>
      </div>

      <div class="field">
        <label for="cause">Cause <span class="required">*</span></label>
        <select id="cause" required>
          <option value="Other">Other</option>
          <option>Passenger issues</option>
          <option>Passenger assistance / PRM</option>
          <option>Passenger loading / alighting</option>
          <option>Door / dispatch issue</option>
          <option>Train crew</option>
          <option>Train operating / working practices</option>
          <option>Signalling</option>
          <option>Points / point failure</option>
          <option>Track / permanent way</option>
          <option>Level crossing</option>
          <option>Power supply / electrical</option>
          <option>Overhead line equipment</option>
          <option>Rolling stock / train fault</option>
          <option>Fleet / unit availability</option>
          <option>Station / platform</option>
          <option>Congestion / regulation</option>
          <option>Previous late running</option>
          <option>Timetable / planning</option>
          <option>Network Rail infrastructure</option>
          <option>Weather / environmental conditions</option>
          <option>Animals / trespass / vandalism</option>
          <option>Emergency services</option>
          <option>Police / security incident</option>
          <option>Fatality / person on railway</option>
          <option>External incident</option>
          <option>Engineering works</option>
          <option>Infrastructure restrictions</option>
          <option>Other railway operator</option>
        </select>
      </div>

      <div class="field hidden" id="otherCauseWrap">
        <label for="otherCause">Other cause <span class="required">*</span></label>
        <input id="otherCause" type="text" placeholder="Enter the cause">
      </div>

      <div class="field">
        <label for="control">Control desk aware?</label>
        <select id="control">
          <option value="No — Minor">No — Minor</option>
          <option value="Yes — SNE">Yes — SNE</option>
          <option value="Yes — MMA">Yes — MMA</option>
          <option value="Yes — South Coast">Yes — South Coast</option>
          <option value="Yes — South West">Yes — South West</option>
        </select>
      </div>

      <div class="field">
        <label for="comments">Comments</label>
        <textarea id="comments" placeholder="Additional information (optional)"></textarea>
      </div>

      <div class="buttons">
        <button type="button" class="primary" id="copyClipboard">📋 Copy to Clipboard</button>
        <button type="button" class="secondary" id="copyEmail">✉️ Copy to Email / Open Outlook</button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>

      <div class="preview">
        <strong>Email preview</strong>
        <div id="previewText">Complete the form above to preview the email.</div>
      </div>
    </form>
    <footer>Train Delay Report</footer>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function localDate(){
  const d = new Date();
  const offset = d.getTimezoneOffset();
  return new Date(d.getTime() - offset*60000).toISOString().slice(0,10);
}
$("date").value = localDate();

$("headcode").addEventListener("input", e => {
  e.target.value = e.target.value.toUpperCase();
  updatePreview();
});
["date","delay","comments","control"].forEach(id => $(id).addEventListener("input", updatePreview));
$("cause").addEventListener("change", () => {
  const isOther = $("cause").value === "Other";
  $("otherCauseWrap").classList.toggle("hidden", !isOther);
  $("otherCause").required = isOther;
  updatePreview();
});
$("otherCause").addEventListener("input", updatePreview);

function displayDate(){
  const value = $("date").value;
  if(!value) return "";
  const [y,m,d] = value.split("-");
  return `${d}/${m}/${y}`;
}
function causeText(){
  return $("cause").value === "Other" ? $("otherCause").value.trim() : $("cause").value;
}
function buildEmail(){
  const headcode = $("headcode").value.trim().toUpperCase();
  const delay = $("delay").value.trim();
  const date = displayDate();
  const reason = causeText();
  const comments = $("comments").value.trim();
  const control = $("control").value;

  let body = `Hi, for info purposes please find a summary of a delay to ${headcode} on ${date}, this was due to ${reason}`;
  if(comments) body += ` - ${comments}`;
  body += `\n\nThe Train was delayed by ${delay} minutes by this.`;
  if(control.startsWith("No")) {
    body += `\nControl were not informed (Minor).`;
  } else {
    body += `\nControl were informed (${control.replace("Yes — ","")}).`;
  }
  return {
    subject:`Delay of ${delay} mins on ${headcode} - ${date}`,
    body
  };
}
function validate(){
  const form = $("delayForm");
  if(!form.checkValidity()){
    form.reportValidity();
    return false;
  }
  if($("cause").value === "Other" && !$("otherCause").value.trim()){
    $("otherCause").focus();
    $("otherCause").reportValidity();
    return false;
  }
  return true;
}
function updatePreview(){
  const headcode = $("headcode").value.trim().toUpperCase();
  const delay = $("delay").value.trim();
  const date = displayDate();
  const reason = causeText();
  if(!headcode || !delay || !date || !reason){
    $("previewText").textContent = "Complete the form above to preview the email.";
    return;
  }
  const e = buildEmail();
  $("previewText").textContent = `Subject: ${e.subject}\n\n${e.body}`;
}
async function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    await navigator.clipboard.writeText(text);
  }else{
    const ta=document.createElement("textarea");
    ta.value=text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
}
function status(msg){
  $("status").textContent = msg;
  setTimeout(()=>{$("status").textContent=""},2500);
}
$("copyClipboard").addEventListener("click", async ()=>{
  if(!validate()) return;
  const e = buildEmail();
  try{
    await copyText(`Subject: ${e.subject}\n\n${e.body}`);
    status("Email copied to clipboard ✓");
  }catch(err){
    status("Unable to copy automatically.");
  }
});
$("copyEmail").addEventListener("click", async ()=>{
  if(!validate()) return;
  const e = buildEmail();
  try{
    await copyText(e.body);
  }catch(err){}
  window.location.href = `mailto:?subject=${encodeURIComponent(e.subject)}&body=${encodeURIComponent(e.body)}`;
});
updatePreview();
</script>
</body>
</html>
